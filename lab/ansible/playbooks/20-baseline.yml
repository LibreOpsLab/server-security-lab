---
# Give every guest the functional baseline, admin01 included (so its own clock also follows the DC;
# verify's NTP check runs on whichever machine you invoke it from, which is normally admin01).
# Debian LXC templates ship without Python, so bootstrap it first.
- name: Bootstrap Python on the guests
  hosts: lxc:vm:admin
  gather_facts: false
  tasks:
    - name: Install Python if it is missing
      ansible.builtin.raw: test -x /usr/bin/python3 || (apt-get update -qq && apt-get install -y -qq python3 python3-apt)
      changed_when: false

- name: Apply the baseline
  hosts: lxc:vm:admin
  roles:
    - baseline
