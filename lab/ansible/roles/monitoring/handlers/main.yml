---
- name: Restart Prometheus
  ansible.builtin.service:
    name: prometheus
    state: restarted

- name: Restart Alertmanager
  ansible.builtin.service:
    name: prometheus-alertmanager
    state: restarted

- name: Restart Loki
  ansible.builtin.service:
    name: loki
    state: restarted

- name: Restart Grafana
  ansible.builtin.service:
    name: grafana-server
    state: restarted
