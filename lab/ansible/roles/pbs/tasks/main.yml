---
# Proxmox Backup Server 4 on a Debian 13 VM (a supported layout: PBS is installed on top of Debian). It runs
# outside Proxmox on purpose, so a backup does not live on the hypervisor it protects.
- name: Fetch the Proxmox archive signing key for Debian 13
  ansible.builtin.get_url:
    url: https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
    dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
    mode: "0644"

- name: Add the Proxmox Backup Server (no-subscription) repository, restricted to that key
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pbs
      Suites: trixie
      Components: pbs-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

- name: Install Proxmox Backup Server
  ansible.builtin.apt:
    name: proxmox-backup-server
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Create the datastore
  ansible.builtin.shell: >-
    set -o pipefail;
    proxmox-backup-manager datastore list | grep -qw lab ||
    proxmox-backup-manager datastore create lab {{ pbs_datastore_path }}
  args:
    executable: /bin/bash
  register: pbs_datastore
  changed_when: "'TASK OK' in pbs_datastore.stdout or pbs_datastore.stdout | length > 0"

- name: Create the backup user with the generated password
  ansible.builtin.shell: >-
    set -o pipefail;
    proxmox-backup-manager user list | grep -q 'backup@pbs' ||
    proxmox-backup-manager user create backup@pbs --password "$PBS_PW"
  args:
    executable: /bin/bash
  environment:
    PBS_PW: "{{ lookup('ansible.builtin.file', lab_secrets_dir ~ '/pbs_admin_password') }}"
  no_log: true
  changed_when: false

- name: Let that user back up to the datastore
  ansible.builtin.command: proxmox-backup-manager acl update /datastore/lab DatastoreBackup --auth-id backup@pbs
  changed_when: false
