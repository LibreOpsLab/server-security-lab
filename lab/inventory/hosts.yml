---
# Addresses are not repeated here: group_vars/all.yml (lab_hosts) is the one place they live.
all:
  children:
    admin:
      hosts:
        admin01:
          # Ansible runs on this machine, so it manages itself locally rather than over SSH.
          ansible_connection: local
          ansible_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
    proxmox:
      hosts:
        pve01:
    lxc:
      children:
        auth:
          hosts:
            auth01:
        radius:
          hosts:
            radius01:
        monitoring:
          hosts:
            mon01:
        mail:
          hosts:
            mail01:
        files:
          hosts:
            files01:
    # Debian 13 VMs built by hand in VMware (outside Proxmox): the domain controller and the backup server.
    vmware_guests:
      children:
        samba_dc:
          hosts:
            samba-dc01:
        backup:
          hosts:
            pbs01:
    vm:
      children:
        docker:
          hosts:
            docker01:
              # The cloud image's default user; the Ubuntu images disable root's key login.
              ansible_user: ubuntu
              ansible_become: true
