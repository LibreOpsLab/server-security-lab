# Stirling PDF: PDF tools in the browser. It has no good single sign-on of its own, so Traefik puts Authelia
# in front of it (forward auth). Adapted from lab-small-business (which used Authentik).
services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:0.46.2
    container_name: stirling-pdf
    restart: unless-stopped
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      SYSTEM_DEFAULTLOCALE: en-GB
      UI_APPNAME: "Lab PDF Tools"
    volumes:
      - stirling_pdf_data:/usr/share/tessdata
      - stirling_pdf_config:/configs
    networks:
      - lab-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=lab-proxy
      - traefik.http.routers.stirling-pdf.rule=Host(`pdf.lab.internal`)
      - traefik.http.routers.stirling-pdf.tls=true
      - traefik.http.routers.stirling-pdf.middlewares=authelia@file
      - traefik.http.services.stirling-pdf.loadbalancer.server.port=8080

networks:
  lab-proxy:
    external: true

volumes:
  stirling_pdf_data:
  stirling_pdf_config:
