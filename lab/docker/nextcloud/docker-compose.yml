# NextCloud with its own MariaDB, behind Traefik. Adapted from lab-small-business.
# The database lives on a named volume on the VM's own disk (databases never go on network file shares).
services:
  db:
    image: mariadb:11.4
    container_name: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - nextcloud_db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASS}
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASS}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
    networks:
      - nextcloud-internal

  app:
    image: nextcloud:29-apache
    container_name: nextcloud-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASS}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      NEXTCLOUD_ADMIN_USER: nc-admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.lab.internal
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://cloud.lab.internal
      TRUSTED_PROXIES: 172.30.0.0/24
    volumes:
      - nextcloud_data:/var/www/html
      # Single sign-on settings (rendered by Ansible) and the host's CA bundle, which includes the lab CA.
      - ./oidc.config.php:/var/www/html/config/oidc.config.php:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/lab-ca-bundle.crt:ro
    networks:
      - nextcloud-internal
      - lab-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=lab-proxy
      - traefik.http.routers.nextcloud.rule=Host(`cloud.lab.internal`)
      - traefik.http.routers.nextcloud.tls=true
      - traefik.http.services.nextcloud.loadbalancer.server.port=80

  cron:
    image: nextcloud:29-apache
    container_name: nextcloud-cron
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      - app
    volumes:
      - nextcloud_data:/var/www/html
    networks:
      - nextcloud-internal

networks:
  nextcloud-internal:
  lab-proxy:
    external: true

volumes:
  nextcloud_db:
  nextcloud_data:
